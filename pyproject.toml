[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helena"
version = "2.0.0"
description = "H.E.L.E.N.A — a local-first agentic harness: a FastAPI model server over Ollama, plus a full-featured terminal agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "prompt_toolkit>=3.0.43",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
]

[project.scripts]
helena = "helena_harness.__main__:main"
helena-server = "helena_server.__main__:main"
helena-web = "helena_harness.webui:main"

[tool.setuptools.packages.find]
include = ["helena_server*", "helena_harness*"]

[tool.setuptools.package-data]
helena_harness = ["web_static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
