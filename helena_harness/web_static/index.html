<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>H.E.L.E.N.A</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #05080a;
    --panel: #0b1418;
    --line: #123039;
    --cyan: #4fd8e8;
    --cyan-dim: #1c5a66;
    --amber: #e8a94f;
    --red: #e85f5f;
    --text: #cfe9ee;
    --dim: #5f8a92;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% -10%, #0d2229 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace;
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* --- sidebar: session history --- */
  #sidebar {
    width: 240px; flex-shrink: 0;
    border-right: 1px solid var(--line);
    background: #081113;
    display: flex; flex-direction: column;
    transition: margin-left 0.2s ease;
  }
  #sidebar.collapsed { margin-left: -240px; }
  #sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  #sidebar-header span { font-size: 11px; letter-spacing: 0.1em; color: var(--dim); }
  #new-session {
    background: var(--cyan-dim); color: #dffbff; border: none; padding: 4px 8px;
    border-radius: 4px; font-family: inherit; font-size: 11px; cursor: pointer;
  }
  #new-session:hover { background: var(--cyan); color: #001014; }
  #sessions { flex: 1; overflow-y: auto; padding: 6px; }
  .session-item {
    padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
    font-size: 12px; line-height: 1.4;
  }
  .session-item:hover { background: var(--panel); }
  .session-item.active { background: var(--cyan-dim); }
  .session-item .title { color: var(--text); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .meta { color: var(--dim); font-size: 10.5px; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #0c1a1f, transparent);
  }
  #sidebar-toggle {
    background: transparent; border: 1px solid var(--line); color: var(--dim);
    border-radius: 4px; padding: 4px 8px; cursor: pointer; font-family: inherit;
  }
  #sidebar-toggle:hover { color: var(--cyan); border-color: var(--cyan-dim); }
  .ring {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2px solid var(--cyan-dim);
    box-shadow: 0 0 0px var(--cyan);
    transition: box-shadow 0.4s ease, border-color 0.4s ease;
    flex-shrink: 0;
  }
  .ring.thinking { border-color: var(--amber); box-shadow: 0 0 14px var(--amber); animation: pulse 1s infinite; }
  .ring.speaking { border-color: var(--cyan); box-shadow: 0 0 18px var(--cyan); animation: pulse 0.6s infinite; }
  .ring.listening { border-color: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  h1 { font-size: 15px; letter-spacing: 0.28em; margin: 0; font-weight: 600; color: var(--cyan); }
  .meta { font-size: 11px; color: var(--dim); margin-left: auto; text-align: right; line-height: 1.5; }
  select, #bell {
    background: var(--panel); color: var(--cyan); border: 1px solid var(--line);
    font-family: inherit; font-size: 11px; padding: 4px 6px; border-radius: 4px; cursor: pointer;
  }
  #bell.on { color: var(--amber); border-color: var(--amber); }

  #log { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .line { margin-bottom: 10px; max-width: 900px; font-size: 13.5px; line-height: 1.55; }
  .you { color: var(--amber); }
  .you .tag { color: var(--dim); }
  .assistant .tag { color: var(--cyan); font-weight: 600; }
  .notice, .warn, .error { color: var(--dim); font-size: 12px; }
  .warn { color: var(--amber); }
  .error { color: var(--red); }
  .tool { font-size: 12px; color: var(--dim); border-left: 2px solid var(--cyan-dim); padding-left: 10px; margin: 6px 0; }
  .tool.bad { border-left-color: var(--red); color: var(--red); }
  .tool .name { color: var(--cyan); }

  #inputbar { display: flex; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); background: #081113; }
  #inputbar input {
    flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-family: inherit; font-size: 14px; padding: 10px 12px; border-radius: 6px; outline: none;
  }
  #inputbar input:focus { border-color: var(--cyan-dim); }
  #inputbar button {
    background: var(--cyan-dim); color: #dffbff; border: none; padding: 0 18px;
    border-radius: 6px; font-family: inherit; cursor: pointer; letter-spacing: 0.05em;
  }
  #inputbar button:hover { background: var(--cyan); color: #001014; }

  #permission {
    position: fixed; inset: 0; background: rgba(3,8,10,0.85);
    display: none; align-items: center; justify-content: center;
  }
  #permission.show { display: flex; }
  .card {
    background: var(--panel); border: 1px solid var(--amber); border-radius: 10px;
    padding: 22px 26px; max-width: 560px; width: 90%; box-shadow: 0 0 40px rgba(232,169,79,0.15);
  }
  .card h2 { margin: 0 0 6px; font-size: 14px; color: var(--amber); }
  .card .preview { font-size: 13px; margin: 10px 0; color: var(--text); }
  .card .detail { font-size: 11.5px; color: var(--dim); white-space: pre-wrap; max-height: 160px; overflow-y: auto; margin-bottom: 14px; }
  .card .danger { color: var(--red); font-size: 12px; margin-bottom: 10px; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; }
  .choices button {
    background: transparent; border: 1px solid var(--cyan-dim); color: var(--text);
    padding: 8px 14px; border-radius: 6px; font-family: inherit; font-size: 12px; cursor: pointer;
  }
  .choices button:hover { border-color: var(--cyan); color: var(--cyan); }
  .choices button.deny { border-color: var(--red); }
  .choices button.deny:hover { color: var(--red); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <span>SESSIONS</span>
    <button id="new-session">+ NEW</button>
  </div>
  <div id="sessions"></div>
</div>

<div id="main">
<header>
  <button id="sidebar-toggle">☰</button>
  <div class="ring" id="ring"></div>
  <h1>H.E.L.E.N.A</h1>
  <div class="meta" id="meta">connecting…</div>
  <button id="bell" title="Notify me when a turn finishes and this tab isn't focused">🔔 off</button>
  <select id="mode">
    <option value="ask">ask</option>
    <option value="auto">auto</option>
    <option value="plan">plan</option>
    <option value="yolo">yolo</option>
  </select>
</header>

<div id="log"></div>

<div id="inputbar">
  <input id="text" type="text" placeholder="Talk to HELENA…" autofocus>
  <button id="send">SEND</button>
</div>
</div>

<div id="permission">
  <div class="card">
    <h2 id="perm-tool"></h2>
    <div class="preview" id="perm-preview"></div>
    <div class="danger" id="perm-danger" style="display:none"></div>
    <div class="detail" id="perm-detail"></div>
    <div class="choices">
      <button data-answer="once">Yes, once</button>
      <button data-answer="always">Always allow</button>
      <button data-answer="session">Allow this session</button>
      <button data-answer="no" class="deny">No</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById('log');
const ring = document.getElementById('ring');
const meta = document.getElementById('meta');
const modeSelect = document.getElementById('mode');
const permission = document.getElementById('permission');
const sidebar = document.getElementById('sidebar');
const sessionsEl = document.getElementById('sessions');
const bell = document.getElementById('bell');
let assistantLine = null;
let currentSessionId = null;

function append(html, cls) {
  const div = document.createElement('div');
  div.className = 'line ' + (cls || '');
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function setRing(state) {
  ring.className = 'ring ' + state;
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// --- session sidebar --------------------------------------------------

async function refreshSessions() {
  try {
    const res = await fetch('/api/sessions');
    const rows = await res.json();
    sessionsEl.innerHTML = '';
    rows.forEach(r => {
      const div = document.createElement('div');
      div.className = 'session-item' + (r.id === currentSessionId ? ' active' : '');
      div.innerHTML = `<span class="title">${escapeHtml(r.title || '(untitled)')}</span>` +
                      `<span class="meta">${r.age} · ${r.messages} msgs</span>`;
      div.onclick = () => ws.send(JSON.stringify({type: 'load_session', id: r.id}));
      sessionsEl.appendChild(div);
    });
  } catch (e) { /* server may not be up yet on first paint */ }
}

document.getElementById('sidebar-toggle').onclick = () => sidebar.classList.toggle('collapsed');
document.getElementById('new-session').onclick = () => ws.send(JSON.stringify({type: 'new_session'}));

function renderHistory(messages) {
  log.innerHTML = '';
  (messages || []).forEach(m => {
    if (m.role === 'user' && typeof m.content === 'string') {
      append(`<span class="tag">you </span>${escapeHtml(m.content)}`, 'you');
    } else if (m.role === 'assistant' && typeof m.content === 'string' && m.content) {
      append(`<span class="tag">HELENA </span>${escapeHtml(m.content).replace(/\n/g, '<br>')}`, 'assistant');
    }
  });
}

// --- push notifications -------------------------------------------------

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function enablePush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    append('push notifications aren\'t supported in this browser', 'warn');
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { append('notification permission denied', 'warn'); return; }
  try {
    // register() resolves as soon as registration *starts* (installing
    // state) — subscribing against that can fail with "no active Service
    // Worker" if it hasn't finished activating yet. `.ready` resolves only
    // once a worker is actually active, which is what subscribe() needs.
    await navigator.serviceWorker.register('/sw.js');
    const reg = await navigator.serviceWorker.ready;
    // A stale subscription from an earlier attempt (e.g. before this fix)
    // can carry a mismatched applicationServerKey and make subscribe()
    // throw InvalidStateError — clear it first so this always starts clean.
    const existing = await reg.pushManager.getSubscription();
    if (existing) { await existing.unsubscribe(); }
    const keyRes = await fetch('/push/vapid-public-key');
    if (!keyRes.ok) {
      append('push needs the server\'s push extra installed (pip install -e ".[push]")', 'warn');
      return;
    }
    const { key } = await keyRes.json();
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(key),
    });
    await fetch('/push/subscribe', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(sub),
    });
    bell.classList.add('on');
    bell.textContent = '🔔 on';
    append('notifications on — you\'ll get one when a turn finishes and this tab is backgrounded', 'notice');
  } catch (e) {
    append('couldn\'t enable notifications: ' + e, 'warn');
  }
}

bell.onclick = () => {
  if (bell.classList.contains('on')) {
    bell.classList.remove('on'); bell.textContent = '🔔 off';
    // subscription itself is left registered server-side; toggling here just
    // stops asking for permission again this tab. Revoke via the browser's
    // own site-settings to fully unsubscribe.
  } else {
    enablePush();
  }
};

document.addEventListener('visibilitychange', () => {
  if (ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({type: 'visibility', hidden: document.hidden}));
  }
});

// --- websocket ------------------------------------------------------------

const ws = new WebSocket(`ws://${location.host}/ws?client=web`);

ws.onopen = () => {
  append('connected — waking HELENA…', 'notice');
  refreshSessions();
  ws.send(JSON.stringify({type: 'visibility', hidden: document.hidden}));
};

ws.onclose = () => { meta.textContent = 'disconnected'; append('connection closed', 'error'); };

modeSelect.onchange = () => ws.send(JSON.stringify({type: 'mode', mode: modeSelect.value}));

ws.onmessage = (evt) => {
  const msg = JSON.parse(evt.data);
  switch (msg.type) {
    case 'ready':
      meta.textContent = `model ${msg.model} · ${msg.workspace}`;
      modeSelect.value = msg.mode;
      setRing('idle');
      const others = (msg.peers || []).filter(p => p !== 'web');
      append('online — say what you need.' + (others.length ? ` (also attached: ${others.join(', ')})` : ''), 'notice');
      break;
    case 'history':
      renderHistory(msg.messages);
      break;
    case 'session_loaded':
      currentSessionId = msg.id;
      renderHistory(msg.messages);
      append(`— session: ${escapeHtml(msg.title || msg.id)} —`, 'notice');
      refreshSessions();
      break;
    case 'notice': append(escapeHtml(msg.text), 'notice'); break;
    case 'warn': append(escapeHtml(msg.text), 'warn'); break;
    case 'error': append(escapeHtml(msg.text), 'error'); setRing('idle'); break;
    case 'queued': append(`queued behind ${escapeHtml(msg.ahead)} — position ${msg.position}`, 'notice'); break;
    case 'turn_owner':
      if (msg.source && msg.source !== 'web') append(`(${escapeHtml(msg.source)} sent this one)`, 'notice');
      break;
    case 'assistant_start':
      assistantLine = append(`<span class="tag">${escapeHtml(msg.label)} </span>`, 'assistant');
      setRing('speaking');
      break;
    case 'token':
      if (assistantLine) assistantLine.innerHTML += escapeHtml(msg.text).replace(/\n/g, '<br>');
      log.scrollTop = log.scrollHeight;
      break;
    case 'assistant_end':
      assistantLine = null;
      break;
    case 'tool_start':
      append(`<span class="name">${escapeHtml(msg.tool)}</span> ${escapeHtml(msg.preview)}`, 'tool');
      break;
    case 'tool_result':
      append(`↳ ${escapeHtml(msg.summary || '')}`, msg.ok ? 'tool' : 'tool bad');
      break;
    case 'turn_done':
      setRing('idle');
      refreshSessions();
      break;
    case 'permission_request':
      showPermission(msg);
      break;
  }
};

function showPermission(msg) {
  document.getElementById('perm-tool').textContent = msg.tool + (msg.agent !== 'helena' ? `  (subagent: ${msg.agent})` : '');
  document.getElementById('perm-preview').textContent = msg.preview;
  const dangerEl = document.getElementById('perm-danger');
  if (msg.danger) { dangerEl.style.display = 'block'; dangerEl.textContent = `⚠ this ${msg.danger}`; }
  else { dangerEl.style.display = 'none'; }
  document.getElementById('perm-detail').textContent = msg.detail || '';
  permission.classList.add('show');
}

document.querySelectorAll('.choices button').forEach(btn => {
  btn.onclick = () => {
    ws.send(JSON.stringify({type: 'permission_answer', answer: btn.dataset.answer}));
    permission.classList.remove('show');
  };
});

function send() {
  const input = document.getElementById('text');
  const text = input.value.trim();
  if (!text) return;
  append(`<span class="tag">you </span>${escapeHtml(text)}`, 'you');
  ws.send(JSON.stringify({type: 'message', text}));
  input.value = '';
}
document.getElementById('send').onclick = send;
document.getElementById('text').addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
